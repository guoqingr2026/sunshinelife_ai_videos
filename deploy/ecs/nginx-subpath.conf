# 子路径部署 — 与 englishlearn / kb 等同域共存
# 在现有 server { } 内: include /etc/nginx/snippets/sunshinelife_ai_videos.conf;

location = /sunshinelife_ai_videos {
    return 301 /sunshinelife_ai_videos/;
}

location /sunshinelife_ai_videos/api/ {
    proxy_pass http://127.0.0.1:3012/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s;
}

location /sunshinelife_ai_videos/files/ {
    proxy_pass http://127.0.0.1:3012/files/;
    proxy_read_timeout 600s;
}

location /sunshinelife_ai_videos/frames/ {
    proxy_pass http://127.0.0.1:3012/frames/;
    proxy_read_timeout 600s;
}

location /sunshinelife_ai_videos/video/ {
    proxy_pass http://127.0.0.1:3012/video/;
    proxy_read_timeout 600s;
}

# 静态前端（修复 alias + SPA 回退，避免 500）
location /sunshinelife_ai_videos/ {
    alias /opt/sunshinelife_ai_videos/frontend/dist/;
    index index.html;
    try_files $uri $uri/ @sunshinelife_videos_spa;
}

location @sunshinelife_videos_spa {
    rewrite ^ /sunshinelife_ai_videos/index.html last;
}

location = /sunshinelife_ai_videos/index.html {
    alias /opt/sunshinelife_ai_videos/frontend/dist/index.html;
}
